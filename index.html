<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Maze ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="screen intro-screen" id="intro">
<div class="card">
<h1>Find Your Way To Me 💕</h1>
<p>I hid a little maze for you. Walk through it, collect the hearts along the way, and see what's waiting at the end.</p>
<button onclick="startGame()">Start ▶</button>
</div>
</div>

<div class="screen game-screen" id="game" hidden>
<div class="hud">
<span id="heart-count">0 💖</span>
</div>
<div class="maze" id="maze"></div>
<div class="dpad">
<button class="dpad-btn up" onclick="tryMove(0,-1)">▲</button>
<div class="dpad-row">
<button class="dpad-btn left" onclick="tryMove(-1,0)">◀</button>
<button class="dpad-btn right" onclick="tryMove(1,0)">▶</button>
</div>
<button class="dpad-btn down" onclick="tryMove(0,1)">▼</button>
</div>
</div>

<div class="letter-overlay" id="letter-overlay">
<div class="letter-paper" id="letter-paper"></div>
</div>

<div class="screen finale-screen" id="finale" hidden>
<div class="card">
<h1>You Found Me! ❤️</h1>
<p>Since we met on <b>30 Dec 2025</b></p>
<div id="counter"></div>
<img src="photo.jpg" class="photo">
<p id="finale-msg"></p>
<button onclick="showFinaleMessage()">Another love message 💌</button>
<p>Our song ❤️</p>
<iframe style="border-radius:12px"
src="https://open.spotify.com/embed/track/0tgVpDi06FyKpA1z0VMD4v"
width="100%"
height="80"
frameBorder="0"
allowfullscreen=""
allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
</iframe>
</div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
